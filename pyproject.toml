[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-ai-labs"
version = "0.1.0"
description = "Hands-on enterprise Agentic AI course and dependency-free reference labs"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ai_labs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

